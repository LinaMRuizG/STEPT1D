# MISSING TO ADD THE LABELS AND NOTES TO EACH VARIABLE

# =============================================================================
# DATA VALIDATION MASTER SCHEMA
# =============================================================================
# Convention:
#   dtype         : int | float | string | categorical | dichotomous | date
#   nullable      : true → NaN allowed | false → NaN flagged as error
#   invalid_action: flag → log to audit_log.csv and set to NaN
#   transformations run in order top to bottom
# =============================================================================

# -----------------------------------------------------------------------------
# GLOBAL: applied to every variable before any variable-level rule
# -----------------------------------------------------------------------------
global: #REVISAR QUE SI ESTEN TODOS LOS VALORES NULABLES
  null_strings:
    - "nan"
    - "NaN"
    - "NAN"
    - "NULL"
    - "null"
    - "None"
    - "none"
    - ""
    - "no se encuentra información en la historia clínica"
    - "no se encuentra informacion en la historia clinica"
    - "no se registró en la historia clínica"
    - "no reportado en la historia clínica"
    - "sin información"
    - "sin informacion"
    - "no reportado"
    - "No es posible establecer el área de residencia"
    - "No se encuentra información en la historia clínica"
    - "No se registró en la historia clínica"
    - "No reportado en la historia clínica"

  invalid_action: flag
 # Revisar qué otros valores se pueden adicionar
 
# -----------------------------------------------------------------------------
# REUSABLE ANCHORS  (referenced with *month_encoding, *yn_coerce, etc.)
# -----------------------------------------------------------------------------
_anchors:
 
  month_encoding: &month_encoding
    "Enero (01)":       1
    "Febrero (02)":     2
    "Marzo (03)":       3
    "Abril (04)":       4
    "Mayo (05)":        5
    "Junio (06)":       6
    "Julio (07)":       7
    "Agosto (08)":      8
    "Septiembre (09)":  9
    "Octubre (10)":     10
    "Noviembre (11)":   11
    "Diciembre (12)":   12
 
  # Si/No → 1/0, null handled by global null_strings
  yn_coerce: &yn_coerce
    "si":  1
    "sí":  1
    "no":  0
 
  # shared transformations for all Si/No dichotomous variables
  yn_transforms: &yn_transforms
    - trim
    - lowercase
    - coerce
    - to_int
 
  # shared transformations for variables encoded from long text
  encode_transforms: &encode_transforms
    - trim
    - encode
 
  # shared transformations for year variables extracted from date strings
  year_transforms: &year_transforms
    - extract_year      # pd.to_datetime → .dt.year → Int64
 
# =============================================================================
# VARIABLES
# =============================================================================
variables:
 
  
  institution:
    label: "Institución"
    note: "THE IDEA WITH THIS IS TO GET ALL THE POSSIBLE UNIQUE RAW VALUES AND MAP TO A DEFAULT LIST OF VALUES"
    dtype: categorical
    nullable: false
    fuzzy_match: true
    threshold: 88
    canonical: ["Hospital Pablo Tobon Uribe",
                "Hospital Universitario San Vicente Fundacion",
                "Clinica Noel",
                "Hospital General de Medellin",
                "Hospital Alma Mater de Antioquia",
                "Hospital Manuel Uribe Angel",
                "Hospital Marco Fidel Suarez"
                ]               
    transformations:
      - trim
      - smart_title_case
    invalid_action: flag
    

  first_name:
    label: "Nombre(s) del paciente"
    dtype: string
    nullable: false
    dedup_key: true
    dedup_normalize: true       # generates shadow column first_name_key (lowercase, no accents)
    transformations:
      - sanitize
      - trim
      - collapse_spaces
      - smart_title_case
      - empty_to_null
    max_length: 120
    pattern: "^[\\p{L}\\s]+$"
    invalid_action: flag


  last_name:
    label: "Apellido(s) del paciente"
    dtype: string
    nullable: false
    dedup_key: true
    dedup_normalize: true       # generates shadow column last_name_key (lowercase, no accents)
    transformations:
      - sanitize
      - trim
      - collapse_spaces
      - smart_title_case
      - empty_to_null
    max_length: 120
    pattern: "^[\\p{L}\\s]+$"
    invalid_action: flag

  identity_document:
    label: "Tipo de documento"
    dtype: int
    nullable: false              # "No se registró" → null (not code 5)
    fuzzy_match: false
    encoding:
      "Registro civil":                      0
      "Tarjeta de identidad":                1
      "Cédula de ciudadanía":                2
      "Cédula de extranjería":               3
      "Otro documento de identidad":         4
    special_null_values: [5]
    transformations: *encode_transforms
    invalid_action: flag
    
  another_id:
    label: "Otro tipo de documento de identidad"
    note: "Ingrese solo letras mayúsculas sin tildes ni símbolos, máximo 30 caracteres"
    dtype: string
    nullable: true
    transformations:
      - trim
      - uppercase
      - empty_to_null
    max_length: 120
    invalid_action: flag

  id_number:
    label: "Número de documento"
    dtype: string
    nullable: false
    dedup_key: true
    transformations:
      - trim
      - uppercase
    pattern: "^[A-Z0-9\\-]+$"
    invalid_action: flag

  sex:
    label: "Sexo"
    dtype: int
    nullable: false              # "No se encuentra información" → null (not code 2)
    fuzzy_match: false
    encoding:
      "Masculino": 0
      "Femenino":  1
    transformations: *encode_transforms
    invalid_action: flag

