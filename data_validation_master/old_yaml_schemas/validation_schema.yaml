# =============================================================================
# DATA VALIDATION MASTER SCHEMA
# Keys   = exact column headers from the raw CSV/XML export
# label  = short snake_case identifier used in cleaned output
# =============================================================================
# Convention:
#   dtype         : int | float | string | categorical | dichotomous | date
#   nullable      : true  → pd.NA allowed and expected
#                   false → pd.NA flagged as "unexpected_null" in audit
#   invalid_action: flag  → log to audit_log.csv
#   transformations run in order top → bottom
# =============================================================================

# -----------------------------------------------------------------------------
# GLOBAL — runs on every column before any variable-level rule
# -----------------------------------------------------------------------------
global:
  null_strings:
    - ""
    - "nan"
    - "NaN"
    - "NAN"
    - "NULL"
    - "null"
    - "None"
    - "none"
    - "Sin Dato"
    - "Sin dato"
    - "sin dato"
    - "sin información"
    - "Sin información"
    - "Sin Información"
    - "sin informacion"
    - "no reportado"
    - "No reportado"
    - "no reportado en la historia clínica"
    - "No reportado en la historia clínica"
    - "no se registró en la historia clínica"
    - "No se registró en la historia clínica"
    - "no se encuentra información en la historia clínica"
    - "No se encuentra información en la historia clínica"
    - "no se encuentra informacion en la historia clinica"
    - "No es posible establecer el área de residencia"
  invalid_action: flag

# -----------------------------------------------------------------------------
# REUSABLE ANCHORS
# -----------------------------------------------------------------------------
_anchors:

  # shared transformations for Si/No string variables
  sino_transforms: &sino_transforms
    - trim
    - smart_title_case    # "si"/"SI"/"sí" → "Si", "no"/"NO" → "No"
    - empty_to_null

  # shared allowed values for Si/No string variables
  sino_allowed: &sino_allowed
    - "Si"
    - "No"

  # shared transformations for year variables (raw format "YYYY-MM-DD")
  year_transforms: &year_transforms
    - extract_year        # pd.to_datetime → .dt.year → Int64

  # shared transformations for month variables (raw "Septiembre (09)" → "Septiembre")
  month_transforms: &month_transforms
    - trim
    - extract_month_name  # "Septiembre (09)" → "Septiembre"
    - smart_title_case
    - empty_to_null

  # shared allowed values for month variables
  month_allowed: &month_allowed
    - "Enero"
    - "Febrero"
    - "Marzo"
    - "Abril"
    - "Mayo"
    - "Junio"
    - "Julio"
    - "Agosto"
    - "Septiembre"
    - "Octubre"
    - "Noviembre"
    - "Diciembre"

  # shared rule for binary indicator columns (raw 0.0 / 1.0 / nan)
  binary_indicator: &binary_indicator
    dtype: dichotomous
    nullable: true
    allowed: [0, 1, null]
    transformations:
      - to_int
    invalid_action: flag

  # shared transformations for time-since variables (int, negatives → null)
  time_transforms: &time_transforms
    - to_int
    - negative_to_null

  # shared year variable base rule
  year_base: &year_base
    dtype: int
    nullable: true
    raw_dtype: date_string
    transformations: *year_transforms
    min: 1900
    max: 2025
    special_null_values: [1800]
    invalid_action: flag

# =============================================================================
# VARIABLES
# Key   = exact column header in the raw CSV
# label = snake_case name used in cleaned output dataframe
# =============================================================================
variables:

  # ---------------------------------------------------------------------------
  # IDENTIFIERS & INSTITUTION
  # ---------------------------------------------------------------------------

  Institución:
    label: "institution"
    note: >
      Open-ended question. Institution where the patient data is
      being collected. Fuzzy-matched to canonical list then encoded.
    dtype: int
    nullable: false
    fuzzy_match: true
    threshold: 88
    canonical:
      - "Hospital Pablo Tobon Uribe"
      - "Hospital Universitario San Vicente Fundacion"
      - "Clinica Noel"
      - "Hospital General de Medellin"
      - "Hospital Alma Mater de Antioquia"
      - "Hospital Manuel Uribe Angel"
      - "Hospital Marco Fidel Suarez"
    encoding:
      "Hospital Pablo Tobon Uribe":                   0
      "Hospital Universitario San Vicente Fundacion":  1
      "Clinica Noel":                                  2
      "Hospital General de Medellin":                  3
      "Hospital Alma Mater de Antioquia":              4
      "Hospital Manuel Uribe Angel":                   5
      "Hospital Marco Fidel Suarez":                   6
    transformations:
      - trim
      - smart_title_case
      - empty_to_null
      - encode              # runs AFTER fuzzy (fuzzy applied separately before encode)
    invalid_action: flag

  Nombre(s) del paciente:
    label: "first_name"
    note: "Open-ended question. First name(s) of the patient."
    dtype: string
    nullable: false
    dedup_key: true
    dedup_normalize: true   # generates shadow column first_name_key
    transformations:
      - sanitize
      - trim
      - collapse_spaces
      - smart_title_case
      - empty_to_null
    max_length: 120
    pattern: "^[\\p{L}\\s]+$"
    invalid_action: flag

  Apellido(s) del paciente:
    label: "last_name"
    note: "Open-ended question. Last name(s) of the patient."
    dtype: string
    nullable: false
    dedup_key: true
    dedup_normalize: true   # generates shadow column last_name_key
    transformations:
      - sanitize
      - trim
      - collapse_spaces
      - smart_title_case
      - empty_to_null
    max_length: 120
    pattern: "^[\\p{L}\\s]+$"
    invalid_action: flag

  Tipo de documento de identidad:
    label: "identity_document_type"
    note: >
      Single-choice question. Type of identity document used
      during the last clinical encounter. Raw values are already
      the string labels.
    dtype: string
    nullable: true
    allowed:
      - "Registro civil"
      - "Tarjeta de identidad"
      - "Cédula de ciudadanía"
      - "Cédula de extranjería"
      - "Otro documento de identidad"
    transformations:
      - trim
      - empty_to_null
    invalid_action: flag

  Otro tipo de documento de identidad:
    label: "another_id"
    note: "Open-ended question. Free text for other identity document types."
    dtype: string
    nullable: true
    transformations:
      - trim
      - smart_title_case
      - empty_to_null
    invalid_action: flag

  Número documento de identidad:
    label: "id_number"
    note: "Open-ended question. Patient identity document number."
    dtype: string
    nullable: false
    dedup_key: true
    transformations:
      - trim
      - uppercase
      - empty_to_null
    pattern: "^[A-Z0-9\\-]+$"
    invalid_action: flag

  Sexo biológico:
    label: "sex"
    note: >
      Single-choice question. Patient biological sex as reported
      in the medical record.
    dtype: string
    nullable: true
    allowed:
      - "Masculino"
      - "Femenino"
    transformations:
      - trim
      - empty_to_null
    invalid_action: flag

