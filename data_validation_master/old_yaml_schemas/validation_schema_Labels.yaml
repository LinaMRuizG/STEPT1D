# =============================================================================
# DATA VALIDATION MASTER SCHEMA for csv-XML values and headers
# =============================================================================
# Convention:
#   dtype         : int | float | string | categorical | dichotomous | date
#   nullable      : true → NaN allowed | false → NaN flagged as error
#   invalid_action: flag → log to audit_log.csv and set to NaN
#   transformations run in order top to bottom
# =============================================================================

# -----------------------------------------------------------------------------
# GLOBAL: applied to every variable before any variable-level rule
# -----------------------------------------------------------------------------
global: #REVISAR QUE SI ESTEN TODOS LOS VALORES NULABLES
  null_strings:
    - "nan"
    - "NaN"
    - "NAN"
    - "NULL"
    - "null"
    - "None"
    - "none"
    - ""
    - "no se encuentra información en la historia clínica"
    - "no se encuentra informacion en la historia clinica"
    - "no se registró en la historia clínica"
    - "no reportado en la historia clínica"
    - "sin información"
    - "sin informacion"
    - "Sin información"
    - "no reportado"
    - "No es posible establecer el área de residencia"
    - "No se encuentra información en la historia clínica"
    - "No se registró en la historia clínica"
    - "No reportado en la historia clínica"
    - "Sin Dato"

  invalid_action: flag
 # Revisar qué otros valores se pueden adicionar
 
# -----------------------------------------------------------------------------
# REUSABLE ANCHORS  (referenced with *month_encoding, *yn_coerce, etc.)
# -----------------------------------------------------------------------------
_anchors:
 
  # Translates extracted Spanish month labels directly to normalized English names
  month_translation_map: &month_translation_map
    "Enero":       "January"
    "Febrero":     "February"
    "Marzo":       "March"
    "Abril":       "April"
    "Mayo":        "May"
    "Junio":       "June"
    "Julio":       "July"
    "Agosto":      "August"
    "Septiembre":  "September"
    "Octubre":     "October"
    "Noviembre":   "November"
    "Diciembre":   "December"

  # Standardized map to normalize localized dichotomous responses into structured tracking strings
  yn_translate_map: &yn_translate_map
    "si":  "Yes"
    "sí":  "Yes"
    "no":  "No"

  # Transformation workflow explicitly forcing standardization down to standardized labels
  yn_translate_transforms: &yn_translate_transforms
    - trim
    - lowercase
    - map_values    # Uses the anchor translation lookup systematically
    - empty_to_null
 
  # shared transformations for variables encoded from long text
  encode_transforms: &encode_transforms
    - trim
    - encode
 
  # shared transformations for year variables extracted from date strings
  year_transforms: &year_transforms
    - extract_year      # pd.to_datetime → .dt.year → Int64
 
# =============================================================================
# VARIABLES
# =============================================================================
variables:
 
  Institución: # FUZZY TO CLEAN THE INPUT
    label: "institution"
    note: "Open-ended question. Institution where the patient data is being collected"
    dtype: int
    nullable: false # "Every patient record MUST have a last name. If it is missing → log it in the audit as an error."
    fuzzy_match: true
    threshold: 88
    canonical: ["Hospital Pablo Tobon Uribe",
                "Hospital Universitario San Vicente Fundacion",
                "Clinica Noel",
                "Hospital General de Medellin",
                "Hospital Alma Mater de Antioquia",
                "Hospital Manuel Uribe Angel",
                "Hospital Marco Fidel Suarez"
                ] 
    encoding_map:
      "Hospital Pablo Tobón Uribe":                    0
      "Hospital Universitario San Vicente Fundación":  1
      "Clínica Noel":                                  2
      "Hospital General de Medellín":                  3
      "Hospital Alma Máter de Antioquia":              4
      "Hospital Manuel Uribe Ángel":                   5
      "Hospital Marco Fidel Suárez":                   6              
    transformations:
      - trim
      - smart_title_case
      - empty_to_null
    invalid_action: flag
    

  Nombre(s) del paciente:
    label: "first_name"
    note: "Open-ended question. Names of patients diagnosed with Type 1 Diabetes"
    dtype: string
    nullable: false
    transformations:
      - sanitize
      - trim
      - collapse_spaces
      - smart_title_case
      - empty_to_null
    max_length: 120
    pattern: "^[\\p{L}\\s]+$"
    invalid_action: flag


  Apellido(s) del paciente:
    label: "last_name"
    note: "Open-ended question. Names of patients diagnosed with Type 1 Diabetes"
    dtype: string
    nullable: false
    transformations:
      - sanitize
      - trim
      - collapse_spaces
      - smart_title_case
      - empty_to_null
    max_length: 120
    pattern: "^[\\p{L}\\s]+$"
    invalid_action: flag

  Tipo de documento de identidad:
    label: "identity_document"
    note: "Single-choice question. Type of identity document the patient used during their last clinical encounter."
    dtype: string
    nullable: true
    encoding_map:
      "Registro civil":                      "Birth Certificate"
      "Tarjeta de identidad":                "Identity Card"
      "Cédula de ciudadanía":                "Citizenship ID"
      "Cédula de extranjería":               "Foreigner ID"
      "Otro documento de identidad":         "Other Identification"
    transformations: *encode_transforms
    invalid_action: flag
    
  Otro tipo de documento de identidad:
    label: "another_id"
    note: "Open-ended question. Other type of identity document"
    dtype: string
    nullable: true
    dtype: categorical
    #fuzzy_match: true # the canonical values will be defined at the end
    #threshold: 88
    #canonical: []
    transformations:
      - trim
      - smart_title_case
    invalid_action: flag

  Número documento de identidad:
    label: "id_number"
    note: "Open-ended question. Patient identity document number"
    dtype: string
    nullable: false
    transformations:
      - trim
      - uppercase
    pattern: "^[A-Z0-9\\-]+$"
    special_null_values: [99]
    invalid_action: flag

  Sexo biológico:
    label: "sex"
    note: "Single-choice question. Patient's biological sex as reported in the medical record""
    dtype: string
    nullable: true
    encoding_map:
      "Masculino": "Male"
      "Femenino":  "Female"
    transformations:
      - trim
      - map_values
      - empty_to_null
    allowed: ["Male", "Female"]
    invalid_action: flag

