  Año de nacimiento:
    label: "birthdate_year"
    note: >
      Single-choice question. Patient year of birth as recorded in
      the medical record. Raw format YYYY-MM-DD. 1800 = unknown.
    <<: *year_base
    nullable: true            # required: special_null_values → some rows become null

  Mes de nacimiento:
    label: "birthdate_month"
    note: "Single-choice question. Patient month of birth."
    dtype: string
    nullable: true
    map_values: *month_translation_map
    allowed: *month_allowed
    transformations: *month_transforms
    invalid_action: flag

  age:
    label: "age"
    note: "Automatically estimated. Patient age in completed years."
    dtype: int
    nullable: true
    min: 0
    max: 100
    transformations:
      - to_int
    invalid_action: flag

