# FINAL LABELS .CSV
# =============================================================================
# DATA VALIDATION MASTER SCHEMA
# Keys   = exact column headers from the raw CSV/XML export
# label  = short snake_case identifier used in the cleaned output dataframe
# =============================================================================
# Convention:
#   dtype         : int | float | string | categorical | dichotomous | date
#   nullable      : true  → pd.NA allowed and expected
#                   false → pd.NA flagged as "unexpected_null" in audit
#   invalid_action: flag  → log to audit_log.csv
#   transformations run in order top → bottom
# =============================================================================

# =============================================================================
# GLOBAL — runs on every object column before any variable-level rule
# =============================================================================
global:
  null_strings:
    - ""
    - "nan"
    - "NaN"
    - "NAN"
    - "NULL"
    - "null"
    - "None"
    - "none"
    - "Sin Dato"
    - "Sin dato"
    - "sin dato"
    - "Sin Datos"
    - "sin información"
    - "Sin información"
    - "Sin Información"
    - "sin informacion"
    - "no reportado"
    - "No reportado"
    - "no reportado en la historia clínica"
    - "No reportado en la historia clínica"
    - "no se registró en la historia clínica"
    - "No se registró en la historia clínica"
    - "no se encuentra información en la historia clínica"
    - "No se encuentra información en la historia clínica"
    - "no se encuentra informacion en la historia clinica"
    - "No es posible establecer el área de residencia"
  invalid_action: flag

# -----------------------------------------------------------------------------
# REUSABLE ANCHORS
# -----------------------------------------------------------------------------
_anchors:

  # ---------------------------------------------------------------------------
  # Month translation: Spanish label (after extract_month_name) → English
  # ---------------------------------------------------------------------------
  month_translation_map: &month_translation_map
    "Enero":       "January"
    "Febrero":     "February"
    "Marzo":       "March"
    "Abril":       "April"
    "Mayo":        "May"
    "Junio":       "June"
    "Julio":       "July"
    "Agosto":      "August"
    "Septiembre":  "September"
    "Octubre":     "October"
    "Noviembre":   "November"
    "Diciembre":   "December"

  # Shared allowed list for all month variables (English)
  month_allowed: &month_allowed
    - "January"
    - "February"
    - "March"
    - "April"
    - "May"
    - "June"
    - "July"
    - "August"
    - "September"
    - "October"
    - "November"
    - "December"

  # Shared transformation for all month variables
  # Raw "Septiembre (09)" → extract_month_name → "Septiembre" → map_values → "September"
  month_transforms: &month_transforms
    - trim
    - extract_month_name    # "Septiembre (09)" → "Septiembre"
    - map_values            # "Septiembre" → "September"
    - empty_to_null

  # ---------------------------------------------------------------------------
  # Yes/No translation: Spanish → English
  # ---------------------------------------------------------------------------
  yn_translate_map: &yn_translate_map
    "si":  "Yes"
    "sí":  "Yes"
    "no":  "No"

  yn_allowed: &yn_allowed
    - "Yes"
    - "No"

  # Shared transformation for all Yes/No string variables
  yn_transforms: &yn_transforms
    - trim
    - lowercase             # normalize casing before map
    - map_values            # "si"/"sí" → "Yes", "no" → "No"
    - empty_to_null

  # ---------------------------------------------------------------------------
  # Binary indicator: raw 0.0 / 1.0 / nan → Int64
  # ---------------------------------------------------------------------------
  binary_indicator: &binary_indicator
    dtype: string
    nullable: true
    allowed: ["Yes", "No"]
    map_values:
      "0":   "No"
      "1":   "Yes"
      "0.0": "No"
      "1.0": "Yes"
    transformations:
      - to_str          # convert float 0.0/1.0 to string "0.0"/"1.0" first
      - trim            # clean any whitespace
      - map_values      # "0.0" → "No", "1.0" → "Yes", "0" → "No", "1" → "Yes"
      - empty_to_null
    invalid_action: flag

  # ---------------------------------------------------------------------------
  # Year extraction: raw "YYYY-MM-DD" → Int64 year
  # ---------------------------------------------------------------------------
  year_transforms: &year_transforms
    - extract_year          # pd.to_datetime → .dt.year → Int64


  year_base: &year_base
    dtype: string           # Changed from int to string
    nullable: true
    raw_dtype: date_string
    transformations: *year_transforms
    pattern: '^\d{4}$'      # Validates exactly 4 digits (e.g., "2018")
    special_null_values: ["1800", 1800]  # Standardizes string sentinel to null
    invalid_action: flag

  # ---------------------------------------------------------------------------
  # Time-since variables: int, negatives → null
  # ---------------------------------------------------------------------------
  time_base: &time_base
    dtype: int
    nullable: true
    min: 0
    negative_action: null
    transformations:
      - to_int
      - negative_to_null
    invalid_action: flag

  # ---------------------------------------------------------------------------
  # encode_transforms: trim + encode (text → int)
  # ---------------------------------------------------------------------------
  encode_transforms: &encode_transforms
    - trim
    - encode

# =============================================================================
# OUTPUT — columns to keep in the final cleaned database
# =============================================================================
