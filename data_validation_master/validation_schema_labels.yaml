# =============================================================================
# VARIABLES
# Key   = exact raw CSV column header
# label = snake_case name in the cleaned output
# =============================================================================
variables:

  # ---------------------------------------------------------------------------
  # IDENTIFIERS & INSTITUTION
  # ---------------------------------------------------------------------------

  Institución:
    label: "institution"
    note: >
      Open-ended question. Institution where patient data is collected.
      Fuzzy-matched to canonical list, then encoded to integer.
    dtype: int
    nullable: false
    fuzzy_match: true
    threshold: 80
    canonical:
      - "Hospital Pablo Tobon Uribe"
      - "Hospital Universitario San Vicente Fundacion"
      - "Clinica Noel"
      - "Hospital General de Medellin"
      - "Hospital Alma Mater de Antioquia"
      - "Hospital Manuel Uribe Angel"
      - "Hospital Marco Fidel Suarez"
      - "Metrosalud"
      - "Hospital Venancio Diaz Diaz"
      - "Hospital Marco Fidel Suarez"
      - "Clid"
      - "Clinica ABC"
      - "Neurum"
    transformations:
      - trim
      - smart_title_case
      - empty_to_null            # runs AFTER fuzzy match (applied separately)
    invalid_action: flag

  Nombre(s) del paciente:
    label: "first_name"
    note: "Open-ended question. Patient first name(s)."
    dtype: string
    nullable: false
    dedup_key: true
    dedup_normalize: true       # generates shadow column first_name_key
    transformations:
      - sanitize
      - trim
      - collapse_spaces
      - smart_title_case
      - empty_to_null
    max_length: 120
    pattern: "^[\\p{L}\\s]+$"
    invalid_action: flag

  Apellido(s) del paciente:
    label: "last_name"
    note: "Open-ended question. Patient last name(s)."
    dtype: string
    nullable: false
    dedup_key: true
    dedup_normalize: true       # generates shadow column last_name_key
    transformations:
      - sanitize
      - trim
      - collapse_spaces
      - smart_title_case
      - empty_to_null
    max_length: 120
    pattern: "^[\\p{L}\\s]+$"
    invalid_action: flag

  Tipo de documento de identidad:
    label: "identity_document_type"
    note: >
      Single-choice question. Type of identity document used during
      the last clinical encounter. Raw values are Spanish strings;
      stored as English equivalents.
    dtype: string
    nullable: true
    map_values:
      "registro civil":             "Birth Certificate"
      "tarjeta de identidad":       "Identity Card"
      "cédula de ciudadanía":       "Citizenship ID"
      "cedula de ciudadania":       "Citizenship ID"
      "cédula de extranjería":      "Foreigner ID"
      "cedula de extranjeria":      "Foreigner ID"
      "tarjeta identidad":       "Identity Card"
      "cédula ciudadanía":       "Citizenship ID"
      "cedula ciudadania":       "Citizenship ID"
      "cédula extranjería":      "Foreigner ID"
      "cedula extranjeria":      "Foreigner ID"
      "otro documento de identidad": "Other ID Document"
    allowed:
      - "Birth Certificate"
      - "Identity Card"
      - "Citizenship ID"
      - "Foreigner ID"
      - "Other ID Document"
    transformations:
      - trim
      - lowercase
      - map_values
      - empty_to_null
    invalid_action: flag

  Otro tipo de documento de identidad:
    label: "another_id"
    note: "Open-ended question. Free text for other identity document types."
    dtype: string
    nullable: true
    fuzzy_match: true
    threshold: 88
    canonical: ["Permiso Proteccion Temporal","Pasaporte","Sin Identificacion"]
    transformations:
      - trim
      - smart_title_case
      - empty_to_null
    invalid_action: flag

  Número documento de identidad:
    label: "id_number"
    note: "Open-ended question. Patient identity document number."
    dtype: string
    nullable: false
    dedup_key: true
    transformations:
      - trim
      - uppercase
      - empty_to_null
    pattern: "^[A-Z0-9\\-]+$"
    invalid_action: flag

  Sexo biológico:
    label: "sex"
    note: >
      Single-choice question. Patient biological sex as reported
      in the medical record.
    dtype: string
    nullable: true
    map_values:
      "masculino": "Male"
      "femenino":  "Female"
    allowed:
      - "Male"
      - "Female"
    transformations:
      - trim
      - lowercase
      - map_values
      - empty_to_null
    invalid_action: flag

  # ---------------------------------------------------------------------------
  # BIRTH & DEMOGRAPHICS
  # ---------------------------------------------------------------------------

  País de nacimiento:
