  # ---------------------------------------------------------------------------

  Fechas de atención general:
    label: "year_episode"
    note: "Comma-separated list of care episode dates in MM/YYYY format."
    dtype: string
    nullable: true
    special_null_values: ["NaN", "nan", "None", "", "null"]
    transformations:
      - trim
      - collapse_spaces
    # Regex explanation:
    # ^(\d{2}/\d{4}       --> Starts with a valid MM/YYYY
    # (\s*,\s*\d{2}/\d{4})* --> Followed by zero or more ", MM/YYYY" pairs
    # )?$                 --> Allows empty / null strings
    pattern: '^(\d{2}/\d{4}(\s*,\s*\d{2}/\d{4})*)?$'
    invalid_action: flag

  
  Fechas de atención por o con diabetes (lo primero que ocurra):
